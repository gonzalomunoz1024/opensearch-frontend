# Builds InfraDashboard the way it ships: the Dashboards platform from this repository, each
# plugin that distribution/plugins.json ships at its pinned commit, the two put together, the
# container image, and a check of the running image against an OpenSearch with the backend plugins
# of the lite backend and no security. Every step is distribution/scripts/build.sh, so the same
# build runs on a laptop.

name: Distribution

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'distribution/**'
      - 'packages/osd-atlas-theme/**'
      - 'src/core/server/core_app/assets/**'
      - '.github/workflows/distribution.yml'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=8192 --dns-result-order=ipv4first'
  YARN_VERSION: 1.22.10

jobs:
  manifest:
    name: Read the plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      plugins: ${{ steps.read.outputs.plugins }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: distribution
      - id: read
        run: |
          echo "version=$(jq -r .dashboardsVersion distribution/plugins.json)" >> "$GITHUB_OUTPUT"
          echo "plugins=$(jq -c '[.plugins[].name]' distribution/plugins.json)" >> "$GITHUB_OUTPUT"

  platform:
    name: Build the platform
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Set up Yarn
        run: |
          npm install --global "yarn@${YARN_VERSION}"
          yarn config set network-timeout 1000000 --global
          echo "YARN_CACHE_LOCATION=$(yarn cache dir)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.YARN_CACHE_LOCATION }}
          key: yarn-Linux-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-Linux-
      - name: Build
        run: distribution/scripts/build.sh platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform
          path: target/opensearch-dashboards-*-linux-x64.tar.gz
          retention-days: 3
          if-no-files-found: error

  plugin:
    name: Build ${{ matrix.plugin }}
    needs: [manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.manifest.outputs.plugins) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Set up Yarn
        run: |
          npm install --global "yarn@${YARN_VERSION}"
          yarn config set network-timeout 1000000 --global
          echo "YARN_CACHE_LOCATION=$(yarn cache dir)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.YARN_CACHE_LOCATION }}
          key: yarn-Linux-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-Linux-
      - name: Build
        run: distribution/scripts/build.sh plugin "${{ matrix.plugin }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ matrix.plugin }}
          path: target/plugins/*.zip
          retention-days: 3
          if-no-files-found: error

  assemble:
    name: Assemble, build the image and check it
    needs: [manifest, platform, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform
          path: target
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plugin-*
          path: target/plugins
          merge-multiple: true
      - name: Assemble
        run: distribution/scripts/build.sh assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infradashboard-${{ env.VERSION }}-linux-x64
          path: target/infradashboard-*-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Start OpenSearch and the image
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose -f distribution/docker/docker-compose.yml up --build --detach --wait --wait-timeout 600
      - name: Check the running image
        run: node distribution/scripts/smoke_test.js
      - name: Container logs
        if: failure()
        run: docker compose -f distribution/docker/docker-compose.yml logs --no-color --tail 300

  branding:
    name: Check the logos against brand.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            distribution
            src/core/server/core_app/assets
      - name: Draw and compare
        run: node distribution/branding/render_assets.js --check

  helm:
    name: Render the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: distribution
      - name: Lint and render
        working-directory: distribution/helm/infradashboard
        run: |
          helm lint .
          helm template release . > /dev/null
          for values in ci/*.yaml; do
            helm lint . --values "$values"
            helm template release . --values "$values" > /dev/null
          done
