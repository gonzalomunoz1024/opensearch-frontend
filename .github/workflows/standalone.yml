# The standalone InfraDashboard (distribution/standalone): type check, unit tests, the check that
# every package in its lockfile is one the target registry holds, the image, and the image
# answering in front of an OpenSearch without security. Nothing here uses the Dashboards tree.

name: Standalone

on:
  push:
    branches: [main]
    paths:
      - 'distribution/standalone/**'
      - '.github/workflows/standalone.yml'
  pull_request:
    paths:
      - 'distribution/standalone/**'
      - 'yarn.lock'
      - '.github/workflows/standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: distribution/standalone

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Every package is one the target registry holds
        run: node scripts/check_lockfile.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the image
        run: docker build -t infradashboard-standalone:ci .
      - name: Start OpenSearch
        working-directory: .
        run: |
          docker compose -f distribution/docker/dev/docker-compose.yml up -d
          for attempt in $(seq 1 60); do
            curl -fs http://localhost:9200/_cluster/health > /dev/null && break
            sleep 3
          done
          curl -fs http://localhost:9200/_cluster/health
      - name: Run the image as a cluster with a restricted policy would
        run: |
          docker run -d --name dashboards --network host \
            --user 1000680000:0 --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e OPENSEARCH_HOSTS='["http://localhost:9200"]' \
            infradashboard-standalone:ci
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:5601/api/status > /dev/null && break
            sleep 2
          done
      - name: Check that it answers
        run: |
          set -e
          curl -fs http://localhost:5601/api/status | grep -q '"state":"green"'
          curl -fs -o /dev/null http://localhost:5601/app/home
          curl -fs -X POST -H 'osd-xsrf: true' -H 'content-type: application/json' \
            -d '{"attributes":{"title":"ci-*"}}' \
            http://localhost:5601/api/saved_objects/index-pattern/ci > /dev/null
          curl -fs 'http://localhost:5601/api/saved_objects/_find?type=index-pattern' | grep -q '"ci-\*"'
      - name: Logs
        if: always()
        run: docker logs dashboards || true
