extends:
  - stylelint-config-standard-scss
  - '@osd/stylelint-config'
rules:
  # while we still use node-sass, only legacy rgb() notation is allowed
  color-function-notation: "legacy"
  # recommended to turn off descending specificity since we use a lot of nesting:
  # https://stylelint.io/user-guide/rules/list/no-descending-specificity/
  no-descending-specificity: null
  # `@container` is standard CSS that this version of stylelint-scss doesn't know yet. It only
  # trips the check when nested (a top-level `@container` already passes), which would leave the
  # rule enforced inconsistently rather than usefully.
  scss/at-rule-no-unknown:
    - true
    - ignoreAtRules:
        - container
  # need to use global function/value names from EUI
  function-name-case: null
  value-keyword-case: null
  scss/no-global-function-names: null
  # camelCase names
  keyframes-name-pattern: "^[a-z][a-zA-Z0-9_-]+$"
  selector-class-pattern: "^[a-z][a-zA-Z0-9_-]+$"
  selector-id-pattern: "^[a-z][a-zA-Z0-9_-]+$"
  scss/at-mixin-pattern: "^[a-z][a-zA-Z0-9_-]+$"
  scss/at-function-pattern: "^[a-z][a-zA-Z0-9_-]+$"
  scss/dollar-variable-pattern: "^[a-z][a-zA-Z0-9_-]+$"
overrides:
  # The Atlas theme restyles OUI's components and names its colours, which is what a theme is
  # for and what these rules keep a plugin from doing
  - files:
      - packages/osd-atlas-theme/**/*.scss
    rules:
      "@osd/stylelint/no_modifying_global_selectors": null
      "@osd/stylelint/no_custom_colors": null
      "@osd/stylelint/no_restricted_properties": null
      "@osd/stylelint/no_restricted_values": null
