# InfraDashboard and an OpenSearch 3.9.0 to try it against. Neither has the security plugin: there
# is no sign-in, and the two talk plain HTTP, as the product ships.
#
# The OpenSearch here stands in for the lite backend (gonzalomunoz1024/opensearch-backend) until
# that has an image in a registry: the official image, started with every plugin taken out of the
# container but the ones the lite backend has, so a page that needs another plugin fails here as
# it would there.
#
#   distribution/scripts/build.sh all        # or download the tarball a CI run built into target/
#   docker compose -f distribution/docker/docker-compose.yml up --build
#
# Then open http://localhost:5601.
name: infradashboard

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    working_dir: /usr/share/opensearch
    # every directory under plugins/ but the three named goes, inside the container only
    entrypoint:
      - bash
      - -O
      - extglob
      - -c
      - >-
        rm -rf plugins/!(opensearch-job-scheduler|opensearch-index-management|opensearch-sql) &&
        exec ./opensearch-docker-entrypoint.sh opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  dashboards:
    image: infradashboard:${VERSION:-3.9.0}
    build:
      context: .
      additional_contexts:
        dist: ../../target
      args:
        VERSION: ${VERSION:-3.9.0}
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      # the same variables the OpenSearch Dashboards image reads
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    ports:
      - '5601:5601'
    healthcheck:
      # The status endpoint answers 200 once the server is up and has reached OpenSearch. The
      # image has no curl, so Node.js asks.
      test:
        - CMD
        - /usr/share/opensearch-dashboards/node/bin/node
        - -e
        - >-
          require('http').get('http://localhost:5601/api/status',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  opensearch-data:
