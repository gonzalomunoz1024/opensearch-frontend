# A local OpenSearch 3.9.0 for working on the Dashboards source (`yarn start`).
# The security plugin is off here so the dev server needs no certificates or sign-in;
# use ../docker-compose.yml to try the built distribution with sign-in as in production.
#
#   docker compose -f distribution/docker/dev/docker-compose.yml up -d
#   yarn start --config distribution/config/dev.yml
name: infradashboard-dev

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '9200:9200'
    volumes:
      - opensearch-dev-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  opensearch-dev-data:
