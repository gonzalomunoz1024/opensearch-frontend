#
# The settings the image starts with. A deployment mounts its own file over this one (the Helm
# chart does), or sets single settings in the environment: opensearch.hosts is OPENSEARCH_HOSTS.
# The names are those of OpenSearch Dashboards; a setting this server has no use for is reported
# at start and otherwise ignored.

server.host: '0.0.0.0'
server.port: 5601
opensearch.hosts: ['http://localhost:9200']
