# The settings the InfraDashboard image starts with.
#
# InfraDashboard ships without the security plugin: it has no sign-in, no tenants and no roles, and
# it talks to an OpenSearch that has none either. Whoever can reach this server can read and change
# everything the OpenSearch behind it holds, so who reaches it is decided outside the product.
#
# A deployment that mounts its own opensearch_dashboards.yml over this file wants the last setting
# in it. A setting of the security plugin (opensearch_security.*) is unknown to this server and
# stops it at start, with a message that names the setting.

opensearch.hosts: [http://localhost:9200]

# One header bar instead of two. The Atlas theme is drawn for the one bar.
opensearchDashboards.branding.useExpandedHeader: false
