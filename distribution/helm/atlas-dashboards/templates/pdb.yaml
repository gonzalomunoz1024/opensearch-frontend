{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "atlas-dashboards.fullname" . }}
  labels:
    {{- include "atlas-dashboards.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "atlas-dashboards.selector" . | nindent 6 }}
{{- end }}
