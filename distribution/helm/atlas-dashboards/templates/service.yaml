apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas-dashboards.fullname" . }}
  labels:
    {{- include "atlas-dashboards.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "atlas-dashboards.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
