# InfraDashboard on Kubernetes: the web app and the server behind it. OpenSearch runs elsewhere;
# point at it below. Secrets are only referenced (names of existing Secrets): the chart never holds
# a value.

image:
  # prefix for a repository given as a bare name, like registry.example.com/platform
  registry: ""
  repository: infradashboard
  tag: ""                        # the chart's appVersion when empty
  pullPolicy: IfNotPresent

# names of existing docker-registry Secrets
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# No user or group is named here, so the default install is admitted under OpenShift's restricted
# policy (restricted-v2), which gives each pod a uid from the namespace's own range and refuses a
# pod that asks for another. The server runs as whichever non-root user it is given: every file of
# the image can be read by any user, and it writes only to the two emptyDir volumes the chart
# mounts (data and /tmp). Without a uid from the cluster it runs as the image's own user, uid and
# gid 1000, like the OpenSearch Dashboards image. Where a cluster's policy wants them named, add
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 1000
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

replicas: 2

# ------------------------------------------------------------------ the OpenSearch it talks to

# InfraDashboard has no sign-in and no permissions of its own, and expects an OpenSearch without
# the security plugin. Whoever reaches the Service can read and change everything that OpenSearch
# holds: decide who reaches it with the Ingress, a NetworkPolicy or a proxy in front.
opensearch:
  # the Service of the lite backend's chart (gonzalomunoz1024/opensearch-backend), in the same
  # namespace
  hosts:
    - http://opensearch-lite:9200
  # Only where something in front of OpenSearch asks for them: an existing Secret with a user the
  # Dashboards server connects as. Every person then acts as that one user.
  credentialsSecret:
    name: ""
    usernameKey: username
    passwordKey: password
  # Only for https hosts: an existing Secret with the CA certificate that signed their
  # certificates.
  caSecret:
    name: ""
    key: ca.crt
  # full, certificate or none; it applies to https hosts. Keep full outside a sandbox.
  sslVerificationMode: full

# ------------------------------------------------------------------ settings

# opensearch_dashboards.yml settings, merged over what the chart sets (the server's host and port,
# the OpenSearch connection above, the one header bar). Never put a secret here: write ${NAME} and
# give NAME a value from a Secret in secrets.env, like
#   config:
#     opensearch.ssl.keystore.password: ${KEYSTORE_PASSWORD}
#   secrets:
#     env:
#       - { name: KEYSTORE_PASSWORD, secretName: infradashboard, key: keystore-password }
# A setting of the security plugin (opensearch_security.*) fails the render: the image has no
# security plugin, and its server stops at start on a setting it does not know.
config: {}

secrets:
  # environment variables from keys of existing Secrets: { name, secretName, key }
  env: []
  # names of existing Secrets whose every key becomes an environment variable
  envFrom: []

# plain environment variables. The image maps the same variables as the OpenSearch Dashboards
# image (OPENSEARCH_HOSTS, SERVER_BASEPATH and so on) to settings.
env: []

# --max-old-space-size and other Node.js options
nodeOptions: "--max-old-space-size=1024"

# ------------------------------------------------------------------ the workload

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 2Gi }

pdb:
  minAvailable: 1

service:
  type: ClusterIP
  port: 5601
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dashboards.example.com
      paths:
        - { path: /, pathType: Prefix }
  # - { secretName: dashboards-tls, hosts: [dashboards.example.com] }
  tls: []

podAnnotations: {}
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
