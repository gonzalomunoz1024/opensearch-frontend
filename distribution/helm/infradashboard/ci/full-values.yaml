# every optional part of the chart on, for `helm lint` and `helm template` in CI
image:
  registry: registry.example.com/platform
imagePullSecrets: [registry-credentials]
opensearch:
  # a proxy in front of OpenSearch that speaks https and asks for a user
  hosts: [https://opensearch-a:9200, https://opensearch-b:9200]
  credentialsSecret: { name: dashboards-server-user, usernameKey: username, passwordKey: password }
  caSecret: { name: opensearch-ca, key: ca.crt }
config:
  server.basePath: /dashboards
  server.rewriteBasePath: true
  opensearch.ssl.keystore.password: ${KEYSTORE_PASSWORD}
secrets:
  env:
    - { name: KEYSTORE_PASSWORD, secretName: infradashboard, key: keystore-password }
  envFrom: [infradashboard-extra]
env:
  - { name: TZ, value: UTC }
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: dashboards.example.com
      paths:
        - { path: /dashboards, pathType: Prefix }
  tls:
    - { secretName: dashboards-tls, hosts: [dashboards.example.com] }
podAnnotations:
  example.com/team: platform
# a cluster whose policy wants the user and groups named
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: { app.kubernetes.io/name: infradashboard }
